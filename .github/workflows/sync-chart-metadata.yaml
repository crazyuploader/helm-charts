name: Sync Chart Metadata

on:
  pull_request:
    paths:
      - "charts/*/Chart.yaml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Detect changed charts
        id: changed
        run: |
          dirs=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'charts/*/Chart.yaml' \
            | xargs -n1 dirname | sort -u | tr '\n' ' ')
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"

      - name: Sync README + changelog annotation
        if: steps.changed.outputs.dirs != ''
        run: python3 scripts/sync_chart_metadata.py ${{ steps.changed.outputs.dirs }}

      - name: Commit if changed
        if: steps.changed.outputs.dirs != ''
        run: |
          if git diff --quiet; then
            echo "No drift, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync chart metadata (README, changelog annotation)"
          git push origin HEAD:${{ github.head_ref }}
