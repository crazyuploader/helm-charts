name: Test Charts

on:
  pull_request: {}
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Detect changed charts
        id: list-changed
        run: |
          changed=$(ct list-changed --config ct.yaml)
          echo "changed=$([ -n "$changed" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Lint changed charts
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --config ct.yaml

  install:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Detect changed charts
        id: list-changed
        run: |
          changed=$(ct list-changed --config ct.yaml)
          echo "changed=$([ -n "$changed" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@v1.14.0

      - name: Install Postgres for n8n
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          kubectl create namespace n8n-ci
          kubectl apply -n n8n-ci -f .github/ci/postgres.yaml
          kubectl rollout status -n n8n-ci deployment/n8n-ci-postgresql --timeout=180s

      - name: Create n8n secret
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          kubectl create secret generic n8n-ci-secret -n n8n-ci \
            --from-literal=db_password=ci-password \
            --from-literal=encryption_key="$(openssl rand -hex 32)" \
            --from-literal=runner_auth_token="$(openssl rand -hex 32)"

      - name: Run chart-testing install
        if: steps.list-changed.outputs.changed == 'true'
        run: ct install --config ct.yaml
