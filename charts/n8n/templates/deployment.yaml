apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "n8n.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.deploymentStrategy }}
  selector:
    matchLabels:
      {{- include "n8n.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "n8n.labels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if or .Values.serviceAccount.create .Values.serviceAccount.name }}
      serviceAccountName: {{ include "n8n.serviceAccountName" . }}
      {{- end }}
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: n8n
          image: "{{ .Values.image.repository }}:{{ include "n8n.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # n8n writes tmp files to container FS; add tmpfs mounts before enabling
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.config.port }}
            {{- if .Values.runner.enabled }}
            - name: task-broker
              containerPort: {{ .Values.runner.brokerPort }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "n8n.fullname" . }}
          env:
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "existingSecret is required" .Values.existingSecret }}
                  key: db_password
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: encryption_key
            {{- if .Values.runner.enabled }}
            - name: N8N_RUNNERS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: runner_auth_token
            {{- end }}
            {{- if and .Values.config.smtp.enabled }}
            - name: N8N_SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: smtp_password
            {{- end }}
            {{- if .Values.config.userManagement.jwtSecretFromExistingSecret }}
            - name: N8N_USER_MANAGEMENT_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: user_management_jwt_secret
            {{- end }}
            {{- if eq .Values.config.executionsMode "queue" }}
            {{- if .Values.queue.redis.passwordFromExistingSecret }}
            - name: QUEUE_BULL_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "existingSecret required when queue.redis.passwordFromExistingSecret is true" .Values.existingSecret }}
                  key: redis_password
            {{- else if .Values.queue.redis.password }}
            - name: QUEUE_BULL_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "n8n.fullname" . }}-queue
                  key: QUEUE_BULL_REDIS_PASSWORD
            {{- end }}
            {{- end }}
            # AI Assistant secrets
            {{- if .Values.aiAssistant }}
            {{- if .Values.aiAssistant.builder }}
            {{- if and .Values.aiAssistant.builder.enabled .Values.aiAssistant.builder.anthropicKeyFromExistingSecret }}
            - name: N8N_AI_ANTHROPIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: ai_builder_anthropic_key
            {{- else if and .Values.aiAssistant.builder.enabled .Values.aiAssistant.builder.anthropicKey }}
            - name: N8N_AI_ANTHROPIC_KEY
              value: {{ .Values.aiAssistant.builder.anthropicKey | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.aiAssistant.instanceAi }}
            {{- if .Values.aiAssistant.instanceAi.modelApiKeyFromExistingSecret }}
            - name: N8N_INSTANCE_AI_MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: instance_ai_model_api_key
            {{- else if .Values.aiAssistant.instanceAi.modelApiKey }}
            - name: N8N_INSTANCE_AI_MODEL_API_KEY
              value: {{ .Values.aiAssistant.instanceAi.modelApiKey | quote }}
            {{- end }}
            {{- if .Values.aiAssistant.instanceAi.sandbox }}
            {{- if or (and .Values.aiAssistant.instanceAi.sandbox.enabled (eq .Values.aiAssistant.instanceAi.sandbox.provider "daytona")) (and .Values.aiAssistant.agents .Values.aiAssistant.agents.sandbox .Values.aiAssistant.agents.sandbox.enabled) }}
            {{- if .Values.aiAssistant.instanceAi.sandbox.daytonaApiKeyFromExistingSecret }}
            - name: DAYTONA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: daytona_api_key
            {{- else if .Values.aiAssistant.instanceAi.sandbox.daytonaApiKey }}
            - name: DAYTONA_API_KEY
              value: {{ .Values.aiAssistant.instanceAi.sandbox.daytonaApiKey | quote }}
            {{- end }}
            {{- end }}
            {{- if eq .Values.aiAssistant.instanceAi.sandbox.provider "n8n-sandbox" }}
            {{- if .Values.aiAssistant.instanceAi.sandbox.n8nSandboxServiceApiKeyFromExistingSecret }}
            - name: N8N_SANDBOX_SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: n8n_sandbox_service_api_key
            {{- else if .Values.aiAssistant.instanceAi.sandbox.n8nSandboxServiceApiKey }}
            - name: N8N_SANDBOX_SERVICE_API_KEY
              value: {{ .Values.aiAssistant.instanceAi.sandbox.n8nSandboxServiceApiKey | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.aiAssistant.instanceAi.braveSearchApiKeyFromExistingSecret }}
            - name: INSTANCE_AI_BRAVE_SEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: instance_ai_brave_search_key
            {{- else if .Values.aiAssistant.instanceAi.braveSearchApiKey }}
            - name: INSTANCE_AI_BRAVE_SEARCH_API_KEY
              value: {{ .Values.aiAssistant.instanceAi.braveSearchApiKey | quote }}
            {{- end }}
            {{- if .Values.aiAssistant.instanceAi.gatewayApiKeyFromExistingSecret }}
            - name: N8N_INSTANCE_AI_GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: instance_ai_gateway_api_key
            {{- else if .Values.aiAssistant.instanceAi.gatewayApiKey }}
            - name: N8N_INSTANCE_AI_GATEWAY_API_KEY
              value: {{ .Values.aiAssistant.instanceAi.gatewayApiKey | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "n8n.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
