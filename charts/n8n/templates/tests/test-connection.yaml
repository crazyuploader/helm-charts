apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "n8n.fullname" . }}-test-connection"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  containers:
    - name: healthz
      image: busybox:1.37
      command:
        - wget
        - "-qO-"
        - "http://{{ include "n8n.fullname" . }}:{{ .Values.service.port }}/healthz"
  restartPolicy: Never
