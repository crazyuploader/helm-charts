{{- if .Values.aiAssistant }}
{{- $builderApiKey := and .Values.aiAssistant.builder .Values.aiAssistant.builder.enabled (not .Values.aiAssistant.builder.anthropicKeyFromExistingSecret) .Values.aiAssistant.builder.anthropicKey }}
{{- $modelApiKey := and .Values.aiAssistant.instanceAi (not .Values.aiAssistant.instanceAi.modelApiKeyFromExistingSecret) .Values.aiAssistant.instanceAi.modelApiKey }}
{{- $agentsSandboxEnabled := and .Values.aiAssistant.agents .Values.aiAssistant.agents.sandbox .Values.aiAssistant.agents.sandbox.enabled }}
{{- $instanceDaytonaEnabled := and .Values.aiAssistant.instanceAi .Values.aiAssistant.instanceAi.sandbox .Values.aiAssistant.instanceAi.sandbox.enabled (eq .Values.aiAssistant.instanceAi.sandbox.provider "daytona") }}
{{- $daytonaApiKey := and .Values.aiAssistant.instanceAi .Values.aiAssistant.instanceAi.sandbox (or $instanceDaytonaEnabled $agentsSandboxEnabled) (not .Values.aiAssistant.instanceAi.sandbox.daytonaApiKeyFromExistingSecret) .Values.aiAssistant.instanceAi.sandbox.daytonaApiKey }}
{{- $n8nSandboxServiceApiKey := and .Values.aiAssistant.instanceAi .Values.aiAssistant.instanceAi.sandbox (eq .Values.aiAssistant.instanceAi.sandbox.provider "n8n-sandbox") (not .Values.aiAssistant.instanceAi.sandbox.n8nSandboxServiceApiKeyFromExistingSecret) .Values.aiAssistant.instanceAi.sandbox.n8nSandboxServiceApiKey }}
{{- $braveSearchApiKey := and .Values.aiAssistant.instanceAi (not .Values.aiAssistant.instanceAi.braveSearchApiKeyFromExistingSecret) .Values.aiAssistant.instanceAi.braveSearchApiKey }}
{{- $gatewayApiKey := and .Values.aiAssistant.instanceAi (not .Values.aiAssistant.instanceAi.gatewayApiKeyFromExistingSecret) .Values.aiAssistant.instanceAi.gatewayApiKey }}
{{- if or $builderApiKey $modelApiKey $daytonaApiKey $n8nSandboxServiceApiKey $braveSearchApiKey $gatewayApiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "n8n.fullname" . }}-ai
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $builderApiKey }}
  ai_builder_anthropic_key: {{ .Values.aiAssistant.builder.anthropicKey | quote }}
  {{- end }}
  {{- if $modelApiKey }}
  instance_ai_model_api_key: {{ .Values.aiAssistant.instanceAi.modelApiKey | quote }}
  {{- end }}
  {{- if $daytonaApiKey }}
  daytona_api_key: {{ .Values.aiAssistant.instanceAi.sandbox.daytonaApiKey | quote }}
  {{- end }}
  {{- if $n8nSandboxServiceApiKey }}
  n8n_sandbox_service_api_key: {{ .Values.aiAssistant.instanceAi.sandbox.n8nSandboxServiceApiKey | quote }}
  {{- end }}
  {{- if $braveSearchApiKey }}
  instance_ai_brave_search_key: {{ .Values.aiAssistant.instanceAi.braveSearchApiKey | quote }}
  {{- end }}
  {{- if $gatewayApiKey }}
  instance_ai_gateway_api_key: {{ .Values.aiAssistant.instanceAi.gatewayApiKey | quote }}
  {{- end }}
{{- end }}
{{- end }}
