image:
  repository: n8nio/n8n
  tag: "" # blank = Chart.AppVersion
  pullPolicy: IfNotPresent

replicaCount: 1
# RWO PVC requires Recreate
deploymentStrategy: Recreate

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

# ── Core ─────────────────────────────────────────────────────────────────────

config:
  host: "" # required; public hostname
  protocol: https
  editorBaseUrl: "" # blank = protocol+host
  webhookUrl: ""
  proxyHops: 0 # hops before n8n (1 = Cloudflare Tunnel)
  port: 5678
  listenAddress: "0.0.0.0"
  path: "/"
  gracefulShutdownTimeout: 30 # seconds
  timezone: "UTC" # GENERIC_TIMEZONE; sets timezone for cron/schedule triggers

  # ── UI / notifications ──
  disableUi: false
  templatesEnabled: true
  versionNotificationsEnabled: true
  personalizationEnabled: true
  diagnosticsEnabled: false
  hiringBannerEnabled: false

  # ── Public API ──
  publicApiDisabled: false
  publicApiSwaggerUiDisabled: false
  publicApiEndpoint: "api"

  # ── Settings file ──
  enforceSettingsFilePermissions: true
  migrateFsStoragePath: true # renames binaryData -> storage (n8n v3 prep)

  # ── Security ──
  blockEnvAccessInNode: false
  gitNodeDisableBareRepos: true
  secureCookie: true
  samesiteCookie: "lax" # strict | lax | none
  restrictFileAccessTo: "" # comma-separated paths

  # ── Logging ──
  logLevel: info # debug | info | warn | error
  logOutput: console # console | file | console,file
  # only when logOutput includes "file"
  logFileLocation: "/home/node/.n8n/logs/n8n.log"
  logFileMaxSize: 16 # MB
  logFileMaxCount: 100

  # ── Binary data ──
  binaryData:
    mode: filesystem # use database or s3 in queue mode; filesystem is not supported
    # only when mode: filesystem
    localStoragePath: ""

  # ── Executions ──
  executionsMode: regular # regular | queue (requires Redis)
  executionsTimeout: -1 # seconds; -1 = unlimited
  executionsTimeoutMax: 3600
  concurrencyProductionLimit: -1
  # Pruning
  executionsPrune: true
  executionsMaxAge: 336 # hours (14 days)
  executionsPruneMaxCount: 10000
  executionsSaveOnError: all # all | none
  executionsSaveOnSuccess: all # all | none
  executionsSaveManual: true
  executionsSaveOnProgress: false
  executionsPruneSoftDeleteInterval: 60 # minutes
  executionsPruneHardDeleteInterval: 15 # minutes
  # Auto-unpublish workflows after repeated crash loops
  workflowAutodeactivation: false
  workflowAutodeactivationMaxExecutions: 3

  # ── Community packages ──
  # Default will change to false in a future version; set explicitly to keep current behavior.
  unverifiedPackagesEnabled: true

  # ── Compression node limits ──
  # Defaults will be reduced in a future version; set explicitly to keep current limits.
  compressionNodeMaxDecompressedSizeBytes: "2147483648" # 2 GiB
  compressionNodeMaxZipEntries: "5000"

  # ── Nodes ──
  # false when runner.enabled: Python Code node runs in the external runner.
  pythonEnabled: false
  nodesExclude: ""
  nodesInclude: ""
  # JS Code node import allowlists for internal runner mode.
  # External runner: set runner.javascript.builtinAllow / externalAllow.
  nodesFunctionAllowBuiltin: "" # e.g. "fs,path" or "*"
  nodesFunctionAllowExternal: "" # e.g. "lodash,moment"

  # ── Metrics (Prometheus) ──
  metrics:
    enabled: false
    prefix: "n8n_"
    includeDefaultMetrics: true
    includeWorkflowIdLabel: false
    includeNodeTypeLabel: false
    includeApiEndpoints: false

  # ── SMTP / email ──
  # Enables password reset, invites, and 2FA emails.
  # Add smtp_password to existingSecret when enabling this.
  smtp:
    enabled: false
    host: ""
    port: 587
    user: ""
    sender: "" # e.g. "n8n <noreply@example.com>"
    ssl: false
    startTls: true

  # ── User management ──
  # Keeps sessions alive across pod restarts: add user_management_jwt_secret to
  # existingSecret, then set jwtSecretFromExistingSecret: true.
  # n8n regenerates the secret each pod start otherwise, logging out all users.
  userManagement:
    jwtSecretFromExistingSecret: false
    jwtDurationHours: 168
    jwtRefreshTimeoutHours: 0 # 0 = auto (25% of jwtDurationHours)

  # ── License ──
  license:
    activationKey: ""
    serverUrl: ""

# ── Database ─────────────────────────────────────────────────────────────────

database:
  host: "" # required
  port: 5432
  name: n8n
  user: n8n
  schema: public
  poolSize: 2
  connectionTimeout: 20000 # ms; connection wait limit
  idleConnectionTimeout: 30000 # ms; idle connection eviction threshold
  ssl:
    enabled: true
    rejectUnauthorized: false
    ca: ""
    cert: ""
    key: ""

# ── Queue mode (executionsMode=queue) ────────────────────────────────────────

queue:
  redis:
    host: ""
    port: 6379
    # WARNING: Helm stores this in release history as plaintext.
    # Set passwordFromExistingSecret: true and add redis_password to existingSecret.
    password: ""
    passwordFromExistingSecret: false
    db: 0
    username: ""
    tls: false
    prefix: ""
    timeoutThreshold: 10000 # ms

# n8n workflow workers consume queued executions from Redis.
# Enable workers only with config.executionsMode: queue.
worker:
  enabled: false
  replicaCount: 1
  # config.concurrencyProductionLimit overrides this value when it is not -1.
  concurrency: 10 # n8n recommends 5 or more
  healthCheckPort: 5678
  # Set this value higher than config.gracefulShutdownTimeout.
  terminationGracePeriodSeconds: 60
  podAnnotations: {}
  resources:
    requests:
      memory: 512Mi
      cpu: 200m
    limits:
      memory: 1Gi
      cpu: 1000m
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# ── Secrets ──────────────────────────────────────────────────────────────────

# Secret in the same namespace.
# Keys: db_password, encryption_key
# + runner_auth_token            when runner.enabled
# + smtp_password                when config.smtp.enabled
# + user_management_jwt_secret   when config.userManagement.jwtSecretFromExistingSecret
# + redis_password               when queue.redis.passwordFromExistingSecret
# AI assistant secrets:
# + ai_builder_anthropic_key     when aiAssistant.builder.anthropicKeyFromExistingSecret
# + instance_ai_model_api_key    when aiAssistant.instanceAi.modelApiKeyFromExistingSecret
# + daytona_api_key              when aiAssistant.instanceAi.sandbox.daytonaApiKeyFromExistingSecret
# + n8n_sandbox_service_api_key  when aiAssistant.instanceAi.sandbox.provider=n8n-sandbox
# + instance_ai_brave_search_key when aiAssistant.instanceAi.braveSearchApiKeyFromExistingSecret
# + instance_ai_gateway_api_key  when aiAssistant.instanceAi.gatewayApiKeyFromExistingSecret
existingSecret: ""

# ── Task runner ──────────────────────────────────────────────────────────────

# n8nio/runners ships JavaScript and Python 3.13 runners in one image.
# Use a custom image only to pre-install extra Python packages.

runner:
  enabled: true
  # These replicas connect to the main n8n instance. Queue workers get one
  # task runner sidecar per worker pod.
  replicaCount: 1
  # Drop python to skip the Python runner and reduce memory usage.
  types:
    - javascript
    - python
  image:
    repository: n8nio/runners
    tag: "" # blank = Chart.AppVersion
    pullPolicy: IfNotPresent
  brokerPort: 5679
  maxPayload: "1073741824" # bytes; cap for task broker ↔ runner messages (default 1 GiB)
  concurrency: 5
  taskTimeout: 300 # seconds; runner restarts tasks exceeding this
  autoShutdownTimeout: 15 # seconds idle before runner subprocess shuts down
  logLevel: info # debug | info | warn | error
  # JavaScript runner import allowlists
  javascript:
    builtinAllow: "" # stdlib modules allowed; "*" = all; e.g. "fs,path"
    externalAllow: "" # third-party packages; "*" = all
  # Python runner permissions (n8n-task-runners.json env-overrides)
  python:
    stdlibAllow: "" # stdlib modules allowed; "*" = all
    externalAllow: "" # third-party packages allowed; "*" = all
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
  podAnnotations: {}

# ── Persistence ──────────────────────────────────────────────────────────────

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 5Gi
  existingClaim: ""

# ── Services ─────────────────────────────────────────────────────────────────

service:
  type: ClusterIP
  port: 80

nodePort:
  enabled: false
  port: 30678

# ── Kubernetes ───────────────────────────────────────────────────────────────

serviceAccount:
  create: true
  name: ""

resources: {}
#  requests:
#    memory: 512Mi
#    cpu: 250m
#  limits:
#    memory: 1Gi
#    cpu: 1000m

nodeSelector: {}
tolerations: []
affinity: {}

# ── AI Assistant ─────────────────────────────────────────────────────────────

aiAssistant:
  # Whether AI features (AI nodes and AI assistant) are enabled globally.
  enabled: false
  # Maximum time in milliseconds to wait for an HTTP response from an AI service.
  timeout: "3600000" # 1 hour
  # Whether workflow and node parameter values may be sent to AI providers.
  allowSendingParameterValues: true

  # AI workflow builder (Anthropic key for AI-powered workflow building)
  builder:
    enabled: false
    # Set anthropicKeyFromExistingSecret: true and add ai_builder_anthropic_key
    # to existingSecret, or set anthropicKey directly (not recommended).
    anthropicKeyFromExistingSecret: false
    anthropicKey: ""

  # Instance AI (AI Assistant chat and agent capabilities)
  instanceAi:
    # AI Assistant service base URL (optional; overrides default provider endpoint).
    assistantBaseUrl: ""

    # Comma-separated list of modules to enable. Must include "instance-ai"
    # to enable the AI Assistant. Add "agents" to enable agent features.
    enabledModules: ""

    # LLM model in provider/model format (default: anthropic/claude-opus-4-8).
    # For a custom OpenAI-compatible endpoint, set modelUrl too.
    model: "anthropic/claude-opus-4-8"
    modelUrl: ""
    # Set modelApiKeyFromExistingSecret: true and add instance_ai_model_api_key
    # to existingSecret, or set modelApiKey directly (not recommended).
    modelApiKeyFromExistingSecret: false
    modelApiKey: ""

    # MCP servers (comma-separated name=url pairs, e.g. "github=https://mcp.github.com/sse")
    mcpServers: ""

    # Token thresholds for Observer and Reflector
    observerMessageTokens: 30000
    reflectorObservationTokens: 40000

    # Local gateway (filesystem, shell, browser) for all users
    localGatewayDisabled: false
    browserUseEnabled: true

    # Sandbox for code execution (required for AI Assistant)
    sandbox:
      enabled: false
      provider: daytona # daytona | n8n-sandbox

      # Configure the Daytona connection for the AI Assistant and Agents sandboxes.
      daytonaApiUrl: ""
      # Set daytonaApiKeyFromExistingSecret: true and add daytona_api_key
      # to existingSecret, or set daytonaApiKey directly (not recommended).
      daytonaApiKeyFromExistingSecret: false
      daytonaApiKey: ""
      image: "daytonaio/sandbox:0.5.0"
      snapshot: ""
      timeout: 300000 # milliseconds
      namePrefix: ""
      ephemeral: false
      autoStopMinutes: 15
      autoArchiveMinutes: 60
      autoDeleteMinutes: 10080 # 7 days
      daytonaTokenRefreshSkewMs: "300000"
      builderSandboxTtlMs: "900000"

      # n8n Sandbox Service configuration (used when provider: n8n-sandbox)
      # Deploy the n8n-sandbox-service chart separately:
      # https://github.com/n8n-io/n8n-sandbox-service/tree/main/charts/n8n-sandbox-service
      n8nSandboxServiceUrl: ""
      # Set n8nSandboxServiceApiKeyFromExistingSecret: true and add
      # n8n_sandbox_service_api_key to existingSecret.
      n8nSandboxServiceApiKeyFromExistingSecret: false
      n8nSandboxServiceApiKey: ""

    # Web search
    braveSearchApiKeyFromExistingSecret: false
    braveSearchApiKey: ""
    searxngUrl: ""

    # Gateway API key for filesystem access
    gatewayApiKeyFromExistingSecret: false
    gatewayApiKey: ""

    # Output redaction settings
    outputRedaction:
      enabled: true
      secrets: true
      pii: "credit-card"
      placeholder: "[REDACTED]"

    # Thread and persistence settings
    threadTtlDays: 30
    pruneInterval: "3600000" # 1 hour in ms
    snapshotRetention: "86400000" # 24 hours in ms
    checkpointGcRetention: "604800000" # 7 days in ms
    confirmationTimeout: "86400000" # 24 hours in ms

    # Advanced / debug
    thinkingEnabled: true
    runDebugEnabled: false
    durableLog: true
    mcpConnectionsEnabled: false
    activationCapped: false
    activationLockMessageThreshold: 1

  # Agents (requires "agents" in instanceAi.enabledModules)
  agents:
    enabled: false
    modules: ""
    checkpointTtl: 345600 # seconds
    tracing:
      enabled: true
      recordInputs: true
      recordOutputs: true
    sandbox:
      enabled: false
      image: "daytonaio/sandbox:0.5.0"
      snapshot: "daytonaio/sandbox:0.8.0"
      timeout: 300000
      ephemeral: false

extraEnv: []
runnerExtraEnv: []
